<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <form action="#" method="post">
  <fieldset>
    <legend>Контактные данные</legend>
    <label for="name">Имя</label>
    <input id="name" name="name" type="text" required>
    
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="phone">Телефон</label>
    <input id="phone" name="phone" type="tel">
  </fieldset>

  <fieldset>
    <legend>Выберите время</legend>
    <label><input type="radio" name="time" value="10"> 10:00</label>
    <label><input type="radio" name="time" value="18"> 18:00</label>
  </fieldset>

  <fieldset>
    <legend>Дополнительно</legend>
    <label for="comment">Комментарий</label>
    <textarea id="comment" name="comment"></textarea>

    <label><input type="checkbox" name="agreement" required> Я согласен</label>
  </fieldset>

  <button type="submit">Отправить</button>
</form>

</body>
</html>
